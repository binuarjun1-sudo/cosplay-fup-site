<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosplay FUP - Vote</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <div class="logo">FUP<span class="accent">.</span>VOTE</div>
  <div class="nav-links">
    <a href="index.html">Gallery</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="submit.html">Add Your Pic</a>
  </div>
</nav>

<div class="hero">
  <h1>Who's got the <span class="accent">FUP</span> factor?</h1>
  <p id="welcome-message">Loading...</p>
</div>

<div class="search-wrap">
  <input type="text" id="search-input" placeholder="Search cosplays..." />
</div>

<div id="gallery" class="gallery-grid">
  <p class="empty-text">Loading...</p>
</div>

<div id="comment-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <span id="modal-title"></span>
      <button id="modal-close">&times;</button>
    </div>
    <div id="comment-list" class="comment-list"></div>
    <div class="comment-input-row">
      <input type="text" id="comment-input" placeholder="Say something as FUP USER..." maxlength="300" />
      <button id="comment-submit-btn">Post</button>
    </div>
    <p id="comment-status" class="status-text"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
