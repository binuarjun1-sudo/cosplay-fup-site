<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Your Pic - Cosplay FUP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <div class="logo">FUP<span class="accent">.</span>VOTE</div>
  <div class="nav-links">
    <a href="index.html">Gallery</a>
    <a href="leaderboard.html">Leaderboard</a>
  </div>
</nav>

<div class="hero">
  <h1>Add <span class="accent">Your</span> Pic</h1>
  <p>Submit your cosplay for review. Once approved by an admin, it'll appear in the gallery for everyone to vote on.</p>
</div>

<div class="admin-container">
  <input type="text" id="sub-name" placeholder="Character / Cosplay Name" />

  <label class="upload-label" for="sub-image-file">
    <span id="upload-preview-text">📷 Tap to choose a photo</span>
  </label>
  <input type="file" id="sub-image-file" accept="image/*" class="file-input" />

  <img id="preview-img" class="preview-img hidden" />

  <button id="sub-btn">Submit for Review</button>
  <p id="sub-status" class="status-text"></p>
</div>

<script src="submit.js"></script>
</body>
</html>
